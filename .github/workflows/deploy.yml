# Build e deploy no GitHub Pages a cada push na main.
# Site: https://gustavolima2-oss.github.io/teste-onboarding-nexos/
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_DEMO_MODE=true vem do .env.production (tour sempre do início, atalhos R e 1–7).
      - run: npm run build

      # Vídeos de demonstração do HANDOFF.md: o GitHub não toca vídeos do repositório
      # (a página do arquivo só oferece download); pelo Pages eles abrem no navegador.
      - run: mkdir -p dist/demos && cp demo-*.mp4 demo-*.webm dist/demos/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
